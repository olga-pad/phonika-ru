name: Deploy Phonika Games preview to GitHub Pages

on:
  push:
    branches:
      - feat/games
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out main site
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Check out Games preview
        uses: actions/checkout@v4
        with:
          ref: feat/games
          path: preview-source

      - name: Add branch preview under /preview/games
        run: |
          mkdir -p site/preview/games
          rsync -a --exclude '.git' --exclude '.github' preview-source/ site/preview/games/

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
