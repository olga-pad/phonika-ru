name: Playwright tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Serve checked-out application
        run: |
          python3 -m http.server 8000 > /tmp/phonika-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Run full Playwright suite against branch
        env:
          PHONIKA_TEST_BASE_URL: http://127.0.0.1:8000/
        run: npm run test:e2e
      - name: Upload failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-playwright-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
