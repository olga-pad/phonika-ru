name: EN Level regression targeted
on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'tests/en-level-regression.spec.js'
      - '.github/workflows/en-level.yml'
  workflow_dispatch:
jobs:
  level:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test tests/en-level-regression.spec.js --reporter=line --retries=0
      - run: npx playwright test tests/en-level-regression.spec.js --config=playwright.webkit.config.js --reporter=line --retries=0
