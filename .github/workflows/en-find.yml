name: EN Find targeted Playwright
on:
  push:
    branches: [main]
    paths:
      - 'en-find-adapter.js'
      - 'games/games.js'
      - 'tests/en-find.spec.js'
      - 'index.html'
      - '.github/workflows/en-find.yml'
  workflow_dispatch:
jobs:
  en-find:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/en-find.spec.js --reporter=line --retries=0
