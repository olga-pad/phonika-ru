name: EN Reading variety targeted
on:
  push:
    branches: [main]
    paths:
      - 'en-reading-adapter.js'
      - 'tests/en-reading-variety.spec.js'
      - '.github/workflows/en-reading-variety.yml'
  workflow_dispatch:
jobs:
  variety:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/en-reading-variety.spec.js --reporter=line --retries=0
