name: EN Catch production touch regression
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'games/games.js'
      - 'en-catch-adapter.js'
      - 'tests/en-catch-production.spec.js'
      - '.github/workflows/en-catch-production.yml'
  workflow_dispatch:
jobs:
  mobile-touch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium webkit
      - run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/phonika-http.log 2>&1 &
      - name: Test local commit on Chromium mobile
        run: npx playwright test tests/en-catch-production.spec.js --project=mobile --reporter=line --retries=0
        env:
          PHONIKA_TEST_BASE_URL: http://127.0.0.1:8765/
      - name: Test local commit on WebKit mobile
        run: npx playwright test tests/en-catch-production.spec.js --config=playwright.webkit.config.js --project=webkit-mobile --reporter=line --retries=0
        if: success() || failure()
        env:
          PHONIKA_TEST_BASE_URL: http://127.0.0.1:8765/
      - name: Test published GitHub Pages on WebKit mobile
        run: npx playwright test tests/en-catch-production.spec.js --config=playwright.webkit.config.js --project=webkit-mobile --reporter=line --retries=0
        if: success() || failure()
        env:
          PHONIKA_TEST_BASE_URL: https://olga-pad.github.io/phonika-ru/
